# Blueprint Render: buat layanan web gratis SIBIMTA dari repositori ini.
services:
  - type: web
    name: sibimta
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_SECRET
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false        # tempel connection string dari Neon
      - key: DEMO_PASSWORD
        sync: false        # kata sandi untuk akun admin dan akun contoh
      - key: SEED_DEMO
        value: "true"      # ubah ke "false" bila tidak ingin data contoh
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_LIFETIME
        value: "480"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILE_STORE
        value: database
      - key: LOG_CHANNEL
        value: stderr
